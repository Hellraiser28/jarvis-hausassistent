# Release bauen: Setup.exe und Linux-Paket aus genau diesem Stand, mit Pruefsummen.
# - Tag v<Version> (z. B. v0.2.0): baut beides und legt einen ENTWURF eines Releases an. Text, App (Jarvis-App.apk und
#   Jarvis-App.json, signiert ausserhalb von GitHub) und das Veroeffentlichen erledigt der Projektinhaber von Hand.
# - Von Hand (Actions -> Release bauen -> Run workflow): baut nur und haengt die Dateien als Artefakt an.
# - Gibt es zum Tag schon ein Release (von Hand mit lokal gebauten, geprueften Dateien angelegt), bleibt es unberuehrt:
#   Die Setup.exe baut nicht byte-gleich, die Pruefsummen im Release-Text gehoeren zu genau den hochgeladenen Dateien.
#   Der Lauf dient dann nur dem Vergleich (das Linux-Paket muss byte-gleich sein).
# Actions sind auf Commit-SHAs festgenagelt (Lieferkette); neue Versionen erst, wenn sie zwei Wochen alt sind.
name: Release bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # nur fuer den Release-Entwurf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Version bestimmen
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag muss v<x.y.z> heissen" >&2; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Einheitentests
        run: |
          python3 -B vorlagen/bruecke/test_oberflaeche.py
          python3 -B vorlagen/bruecke/test_verhalten.py
          python3 -B vorlagen/bruecke/test_anhang.py
          python3 -B vorlagen/bruecke/test_ed25519.py
          python3 -B vorlagen/bruecke/test_pdf.py
          python3 -B vorlagen/bruecke/test_ausgabe.py
          python3 -B vorlagen/bruecke/test_bilddienst.py
          python3 -B vorlagen/bruecke/test_konvertieren.py
          python3 -B vorlagen/bruecke/test_gedaechtnis.py
          python3 -B vorlagen/bruecke/test_szenen.py
          python3 -B vorlagen/bruecke/test_postfach.py
          python3 -B vorlagen/bruecke/test_briefe.py
          python3 -B vorlagen/bruecke/test_sprache_040.py
          python3 -B vorlagen/bruecke/test_funde_040.py
          python3 -B vorlagen/bruecke/test_kern.py
          python3 -B vorlagen/bruecke/test_regex_laufzeit.py
          python3 -B vorlagen/bruecke/test_lage.py
          python3 -B vorlagen/bruecke/test_ankunft.py
          python3 -B vorlagen/bruecke/test_anruf.py
          python3 -B vorlagen/bruecke/test_faeden.py
          python3 -B vorlagen/bruecke/test_fremdtext.py
          python3 -B vorlagen/bruecke/test_gaeste.py
          python3 -B vorlagen/bruecke/test_grundriss.py
          python3 -B vorlagen/bruecke/test_handy.py
          python3 -B vorlagen/bruecke/test_leinwand.py
          python3 -B vorlagen/bruecke/test_nas_gesundheit.py
          python3 -B vorlagen/bruecke/test_quiz.py
          python3 -B vorlagen/bruecke/test_raeume.py
          python3 -B vorlagen/bruecke/test_sprecher.py
          python3 -B vorlagen/bruecke/test_updates.py
          python3 -B vorlagen/bruecke/test_superhirn.py
          python3 -B vorlagen/bruecke/test_sh_schmiede.py
          python3 -B vorlagen/bruecke/test_sh_kabinett.py
          python3 -B vorlagen/bruecke/test_sh_familienrunde.py
          python3 -B vorlagen/bruecke/test_sh_nachtschicht.py
          python3 -B vorlagen/bruecke/test_sh_weltwache.py
          python3 -B vorlagen/bruecke/test_sh_zeigen.py
          python3 -B vorlagen/bruecke/test_sh_ablageort.py
          python3 -B vorlagen/bruecke/test_sh_lernbegleiter.py
          python3 -B vorlagen/bruecke/test_sh_abenteuer.py
          python3 -B vorlagen/bruecke/test_sh_zeitkapsel.py
          python3 -B vorlagen/bruecke/test_schnellpfad.py
          python3 -B vorlagen/bruecke/test_beobachter.py
          python3 -B vorlagen/bruecke/test_kalender_abo.py
          python3 -B vorlagen/pc/test_echtzeit_befehl.py
          python3 -B vorlagen/pc/test_fenster_schutz.py
          python3 -B vorlagen/pc/test_neuigkeiten.py
          python3 -B vorlagen/pc/test_dateien_pc.py
          python3 -B vorlagen/pc/test_pc_werte.py
          python3 -B vorlagen/pc/test_pc_update.py
          python3 -B vorlagen/pc/test_pc_symbol.py
          python3 -B vorlagen/pc/test_pc_ideen.py

      - name: Setup.exe bauen
        run: sh installer/bauen.sh "$VERSION"

      - name: Linux-Paket bauen
        run: sh linux/bauen.sh

      - name: Dateien sammeln
        run: |
          mkdir -p ausgabe
          cp installer/dist/Jarvis-Setup.exe linux/dist/Jarvis-Linux.tar.gz ausgabe/
          cd ausgabe && sha256sum Jarvis-Setup.exe Jarvis-Linux.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jarvis-${{ env.VERSION }}
          path: ausgabe/

      - name: Release-Entwurf
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME gibt es schon, es bleibt unberuehrt (Dateien nur als Artefakt)."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" ausgabe/* --repo "$GITHUB_REPOSITORY" --draft --title "J.A.R.V.I.S. $VERSION" \
            --notes "Entwurf aus GitHub Actions. Text, Jarvis-App.apk und Jarvis-App.json ergänzen, dann veröffentlichen."
